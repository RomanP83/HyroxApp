<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Hyrox Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1114;
        color: #e7edf2;
        font: 500 15px/1.6 ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      div { max-width: 34ch; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #7b8b98; margin: 0; }
      b { color: #ff5a1f; }
    </style>
  </head>
  <body>
    <div>
      <h1>No signal.</h1>
      <p>
        Pages you have already opened still work offline — <b>this one you have not.</b> Nothing is
        lost; it will be here when you are back in range.
      </p>
    </div>
  </body>
</html>
